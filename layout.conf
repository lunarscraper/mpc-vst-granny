# Groove Bank FX (insert-effect build) for MPC/Force, from the Stitch mockup steve/stitch_layouts/groovebank.md (steve/tools/stitch/convert.py, 2026-10-02).
# Background = the mockup with its live parts hidden; knobs use filmstrips rendered from its own knobs.
# The previous (grid) layout is layout.grid.conf.
# FX build: design/fx_bg_edit.py cleared the display's caption/footer and the SYNC MULTIPLIER box; GENRE + GROOVE share
# the display, MIDI IN CH sits in that box. Q-Links: 4 columns of 2, so a Force's first bank (each column's first two
# slots) holds all eight; LATCH (a switch) stays touch-only.
# v2: the right-top panel holds the chord source (ROOT, CHORD, OCTAVE, SOURCE, notes readout); ROOT/CHORD/OCTAVE are
# the third slots (a Force's second Q-Link bank).
theme_accent=e0a040
theme_accent_hi=ffc266
theme_bg=120d08
theme_box=1d1610
theme_display_bezel=080604
theme_display_bg=140d02
theme_display_cell=241806
theme_display_ink=ffc266
theme_display_off=3a280b
theme_ink=fbf3ea
theme_ink_dim=e0d2c1
theme_ink_faint=8b7863
theme_knob_dot=ffc266
theme_knob_face=fbf3ea
theme_knob_ring=33281d
theme_lcd=0a0705
theme_line=4a3b2b
theme_panel=1d1610
theme_seg_active=ffc266
theme_seg_active_tx=120d08
theme_seg_inactive=2c2219
art_css=groovebank.css
toggle_img=images/btn_off.svg
toggle_img_on=images/btn_on.svg
qlink_bounds=column
qlink_box=slot
label_scale=1
focus_ring=1

[tab MAIN]
art file=images/stitch/bg_0.png x=0 y=86 w=1280 h=628
knob cx=99 cy=532 r=40 label="VARIANT" key=variant strip=images/stitch/knob_0.png frames=64
knob cx=254 cy=532 r=40 label="SWING" key=swing strip=images/stitch/knob_0.png frames=64
knob cx=408 cy=532 r=40 label="GATE" key=gate strip=images/stitch/knob_0.png frames=64
knob cx=563 cy=532 r=40 label="STRUM" key=strum strip=images/stitch/knob_0.png frames=64
knob cx=718 cy=532 r=40 label="ACCENT" key=accent strip=images/stitch/knob_0.png frames=64
toggle cx=872 cy=552 label="LATCH" key=latch
stepper cx=324 cy=219 w=581 h=34 label="" key=genre style=dotmatrix
stepper cx=324 cy=267 w=581 h=34 label="" key=pattern get=pattern_label style=dotmatrix
stepper cx=1115 cy=629 w=270 h=34 label="" key=in_ch style=dotmatrix qbox=no
stepper cx=806 cy=216 w=290 h=40 label="" key=root style=dotmatrix qbox=no
stepper cx=1108 cy=216 w=290 h=40 label="" key=chord style=dotmatrix qbox=no
stepper cx=806 cy=268 w=290 h=40 label="" key=oct style=dotmatrix qbox=no
stepper cx=1108 cy=268 w=290 h=40 label="" key=src style=dotmatrix qbox=no
readout cx=957 cy=336 w=592 h=44 label="" key=chord_label style=dotmatrix
qlinks "MAIN" = genre,pattern,root,chord,variant,swing,oct,-,gate,strum,-,-,accent,in_ch,-,-
